<body class="bg-gray-50 min-h-screen font-sans text-gray-800 flex flex-col selection:bg-gray-200">

    <header id="app-header" class="bg-blue-600 text-white p-4 shadow-md transition-colors duration-500">

    <main class="flex-grow flex flex-col items-center p-4 max-w-2xl mx-auto w-full">
        <!-- 6 Tabs Layout -->
        <div class="grid grid-cols-3 md:flex md:flex-wrap w-full bg-gray-200 rounded-lg p-1 mb-6 shadow-inner gap-1">
            <button id="tab-maths" onclick="switchSubject('maths')" class="flex-1 py-2 text-xs md:text-sm text-center rounded-md font-semibold bg-white text-blue-600 shadow transition-all">Maths</button>
            <button id="tab-cca" onclick="switchSubject('cca')" class="flex-1 py-2 text-xs md:text-sm text-center rounded-md font-semibold text-gray-600 transition-all hover:text-purple-600">CCA</button>
            <button id="tab-english" onclick="switchSubject('english')" class="flex-1 py-2 text-xs md:text-sm text-center rounded-md font-semibold text-gray-600 transition-all hover:text-rose-600">English</button>
            <button id="tab-history" onclick="switchSubject('history')" class="flex-1 py-2 text-xs md:text-sm text-center rounded-md font-semibold text-gray-600 transition-all hover:text-amber-600">History</button>
            <button id="tab-bst" onclick="switchSubject('bst')" class="flex-1 py-2 text-xs md:text-sm text-center rounded-md font-semibold text-gray-600 transition-all hover:text-emerald-600">BST</button>
            <button id="tab-business" onclick="switchSubject('business')" class="flex-1 py-2 text-xs md:text-sm text-center rounded-md font-semibold text-gray-600 transition-all hover:text-indigo-600">Business</button>
        </div>

        <div class="w-full flex justify-between items-center mb-2 px-2">
            <span id="subject-title" class="font-bold text-gray-700">Mathematics</span>
            <span id="progress-text" class="text-sm font-medium text-gray-500">Card 1 / 30</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 mb-6">
            <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 3.3%"></div>
        </div>

        <div class="w-full h-64 md:h-80 perspective-1000 cursor-pointer group" onclick="flipCard()">
            <div id="flashcard" class="flip-card-inner relative w-full h-full transform-style-3d shadow-xl rounded-2xl">
                <div id="q-card" class="absolute w-full h-full backface-hidden bg-white border-2 border-blue-100 rounded-2xl flex flex-col items-center justify-center p-6 text-center transition-colors duration-500">
                    <div id="q-label" class="absolute top-4 left-4 text-xs font-bold text-blue-400 uppercase tracking-wider transition-colors duration-500">Question</div>
                    <p id="question-text" class="text-xl md:text-2xl font-medium text-gray-800 leading-snug"></p>
                    <div class="absolute bottom-4 text-gray-400 text-sm flex items-center gap-1 animate-pulse">
                        Tap to flip
                    </div>
                </div>
                <div id="a-card" class="absolute w-full h-full backface-hidden bg-blue-50 border-2 border-blue-200 rounded-2xl flex flex-col items-center justify-center p-6 text-center rotate-y-180 transition-colors duration-500">
                    <div class="absolute top-4 left-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Answer</div>
                    <p id="answer-text" class="text-xl md:text-2xl font-bold text-blue-800 leading-snug transition-colors duration-500"></p>
                </div>
            </div>
        </div>

        <div class="w-full mt-4">
            <button onclick="randomizeCards()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-300 transition shadow-sm">
                🔀 Randomize Cards
            </button>
        </div>

        <div class="flex justify-between w-full mt-4 gap-4">
            <button onclick="prevCard()" class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-50 transition flex items-center justify-center">Previous</button>
            <button id="next-btn" onclick="nextCard()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold shadow-md hover:bg-blue-700 transition flex items-center justify-center duration-500">Next</button>
        </div>
    </main>

    <footer class="mt-auto p-4 text-center text-gray-400 text-xs">
        Study hard, you've got this!

            document.getElementById('answer-text').className = `text-xl md:text-2xl font-bold ${t.textDark} leading-snug transition-colors duration-500`;
            document.getElementById('next-btn').className = `flex-1 ${t.primary} text-white py-3 rounded-xl font-semibold shadow-md ${t.hover} transition flex items-center justify-center duration-500`;

            document.getElementById('subject-title').innerText = titles[subject];
            updateUI();
        }

        function randomizeCards() {
            for (let i = flashcardsData[currentSubject].length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcardsData[currentSubject][i], flashcardsData[currentSubject][j]] = [flashcardsData[currentSubject][j], flashcardsData[currentSubject][i]];
            }
            currentIndex = 0;
            if (isFlipped) {
                flipCard(true);
                setTimeout(updateUI, 300);
            } else {
                updateUI();
            }
        }

        function flipCard(silent = false) {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').className = `flip-card-inner relative w-full h-full transform-style-3d shadow-xl rounded-2xl ${isFlipped ? 'flipped' : ''}`;
            if (!silent) MathJax.typesetPromise([document.getElementById('question-text'), document.getElementById('answer-text')]);
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % flashcardsData[currentSubject].length;
            resetAndLoadCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + flashcardsData[currentSubject].length) % flashcardsData[currentSubject].length;
            resetAndLoadCard();
        }

        function resetAndLoadCard() {
            if (isFlipped) {
                flipCard(true);
                setTimeout(updateUI, 300);
            } else {
                updateUI();
            }
        }

        function updateUI() {
            const card = flashcardsData[currentSubject][currentIndex];
            document.getElementById('question-text').innerHTML = card.q;
            document.getElementById('answer-text').innerHTML = card.a;
            document.getElementById('progress-text').innerText = `Card ${currentIndex + 1} / ${flashcardsData[currentSubject].length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / flashcardsData[currentSubject].length) * 100}%`;
            MathJax.typesetPromise([document.getElementById('question-text'), document.getElementById('answer-text')]);
        }

        window.onload = updateUI;
    </script>
</body>
</html>
