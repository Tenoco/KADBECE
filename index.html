<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior WAEC Prep: Maths & CCA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .flip-card-inner.flipped { transform: rotateY(180deg); }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 flex flex-col selection:bg-blue-200">

    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">Junior WAEC Quick Prep</h1>
        <p class="text-center text-blue-100 text-sm mt-1">Kaduna State JSCE Revision</p>
    </header>

    <main class="flex-grow flex flex-col items-center p-4 max-w-lg mx-auto w-full">
        <div class="flex w-full bg-gray-200 rounded-lg p-1 mb-6 shadow-inner">
            <button id="tab-maths" onclick="switchSubject('maths')" class="flex-1 py-2 text-center rounded-md font-semibold bg-white text-blue-600 shadow transition-all">Mathematics</button>
            <button id="tab-cca" onclick="switchSubject('cca')" class="flex-1 py-2 text-center rounded-md font-semibold text-gray-600 transition-all hover:text-blue-600">CCA</button>
        </div>

        <div class="w-full flex justify-between items-center mb-2 px-2">
            <span id="subject-title" class="font-bold text-gray-700">Mathematics</span>
            <span id="progress-text" class="text-sm font-medium text-gray-500">Card 1 / 30</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 mb-6">
            <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 3.3%"></div>
        </div>

        <div class="w-full h-64 md:h-80 perspective-1000 cursor-pointer w-full group" onclick="flipCard()">
            <div id="flashcard" class="flip-card-inner relative w-full h-full transform-style-3d shadow-xl rounded-2xl">
                <div class="absolute w-full h-full backface-hidden bg-white border-2 border-blue-100 rounded-2xl flex flex-col items-center justify-center p-6 text-center">
                    <div class="absolute top-4 left-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Question</div>
                    <p id="question-text" class="text-xl md:text-2xl font-medium text-gray-800 leading-snug"></p>
                    <div class="absolute bottom-4 text-gray-400 text-sm flex items-center gap-1 animate-pulse">
                        Tap to flip
                    </div>
                </div>
                <div class="absolute w-full h-full backface-hidden bg-blue-50 border-2 border-blue-200 rounded-2xl flex flex-col items-center justify-center p-6 text-center rotate-y-180">
                    <div class="absolute top-4 left-4 text-xs font-bold text-green-500 uppercase tracking-wider">Answer</div>
                    <p id="answer-text" class="text-xl md:text-2xl font-bold text-blue-800 leading-snug"></p>
                </div>
            </div>
        </div>

        <div class="w-full mt-4">
            <button onclick="randomizeCards()" class="w-full bg-purple-100 text-purple-700 py-2 rounded-lg font-semibold hover:bg-purple-200 transition">
                🔀 Randomize Cards
            </button>
        </div>

        <div class="flex justify-between w-full mt-4 gap-4">
            <button onclick="prevCard()" class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-50 transition flex items-center justify-center">Previous</button>
            <button onclick="nextCard()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold shadow-md hover:bg-blue-700 transition flex items-center justify-center">Next</button>
        </div>
    </main>

    <footer class="mt-auto p-4 text-center text-gray-400 text-xs">
        Study hard, you've got this!
    </footer>

    <script>
        const flashcardsData = {
            maths: [
                { q: "What is the formula for the area of a circle?", a: "$\\pi r^2$" },
                { q: "Solve for $x$: $2x + 5 = 15$", a: "$x = 5$" },
                { q: "What is the square root of 144?", a: "$12$" },
                { q: "Express 0.0045 in standard form.", a: "$4.5 \\times 10^{-3}$" },
                { q: "Find the simple interest on ₦5000 for 2 years at 5% per annum.", a: "$\\frac{P \\times R \\times T}{100} = ₦500$" },
                { q: "What is the sum of angles in a triangle?", a: "$180^\\circ$" },
                { q: "Find the mode of this set: 2, 4, 4, 5, 6, 4, 8", a: "$4$" },
                { q: "Convert $101_2$ to base 10.", a: "$5$" },
                { q: "Perimeter of rect. length 8cm, width 5cm?", a: "$26\\text{cm}$" },
                { q: "Volume of cuboid 3x4x5?", a: "$60\\text{cm}^3$" },
                { q: "Pythagorean theorem?", a: "$a^2 + b^2 = c^2$" },
                { q: "Prob. of Head in coin toss?", a: "$\\frac{1}{2}$" },
                { q: "Area of triangle formula?", a: "$\\frac{1}{2}bh$" },
                { q: "Mean of 2, 4, 6, 8?", a: "$5$" },
                { q: "HCF of 12 and 18?", a: "$6$" },
                { q: "LCM of 4 and 6?", a: "$12$" },
                { q: "Expand $(a+b)(a-b)$", a: "$a^2 - b^2$" },
                { q: "Angles on a straight line sum?", a: "$180^\\circ$" },
                { q: "Complementary angles sum?", a: "$90^\\circ$" },
                { q: "Supplementary angles sum?", a: "$180^\\circ$" },
                { q: "Solve $2x > 8$", a: "$x > 4$" },
                { q: "Area of trapezium?", a: "$\\frac{1}{2}(a+b)h$" },
                { q: "25% as a fraction?", a: "$\\frac{1}{4}$" },
                { q: "Sum of angles at a point?", a: "$360^\\circ$" },
                { q: "Exterior angle of regular hexagon?", a: "$60^\\circ$" },
                { q: "500g to kg?", a: "$0.5\\text{kg}$" },
                { q: "Median of 3, 1, 4, 2, 5?", a: "$3$" },
                { q: "If $y=3x-2$, $x=4$, $y=?$", a: "$10$" },
                { q: "Factorize $x^2+5x+6$", a: "$(x+2)(x+3)$" },
                { q: "What is a scalene triangle?", a: "All sides different" }
            ],
            cca: [
                { q: "Three primary colors?", a: "Red, Yellow, Blue" },
                { q: "Music staff/stave?", a: "5 lines, 4 spaces" },
                { q: "What is Tie-dye?", a: "Resist-dye technique" },
                { q: "Who is a playwright?", a: "Writer of plays" },
                { q: "What is Choreography?", a: "Art of arranging dances" },
                { q: "Secondary colors?", a: "Green, Orange, Purple" },
                { q: "Paper Mache materials?", a: "Paper, Starch/Glue, Water" },
                { q: "Treble clef sign?", a: "High pitches" },
                { q: "Elements of art?", a: "Line, Shape, Color, Texture" },
                { q: "What is an Audition?", a: "Trial performance" },
                { q: "What is a Motif?", a: "Repeated pattern" },
                { q: "Properties of color?", a: "Hue, Value, Intensity" },
                { q: "What is a Monologue?", a: "Speech by one actor" },
                { q: "What is a Mural?", a: "Wall painting" },
                { q: "Three Nigerian crafts?", a: "Pottery, Weaving, Wood carving" },
                { q: "What is an Octave?", a: "Distance of 8 notes" },
                { q: "What is Tempo?", a: "Speed of music" },
                { q: "What is a Tragedy?", a: "Serious play with sad ending" },
                { q: "What is Origami?", a: "Paper folding art" },
                { q: "What is a Portrait?", a: "Painting of a person" },
                { q: "What is Batik?", a: "Wax-resist dyeing" },
                { q: "Who is a Director?", a: "Guides production" },
                { q: "What is Forte?", a: "Play loudly" },
                { q: "Tertiary colors?", a: "Primary + secondary" },
                { q: "Notes on Treble lines?", a: "E, G, B, D, F" },
                { q: "What are Props?", a: "Movable stage objects" },
                { q: "Still Life drawing?", a: "Inanimate objects" },
                { q: "What is a Choir?", a: "Group of singers" },
                { q: "What is a Script?", a: "Written text of play" },
                { q: "What is Calligraphy?", a: "Decorative lettering" }
            ]
        };

        let currentSubject = 'maths';
        let currentIndex = 0;
        let isFlipped = false;

        function switchSubject(subject) {
            currentSubject = subject;
            currentIndex = 0;
            if (isFlipped) flipCard(true);
            const mathsTab = document.getElementById('tab-maths');
            const ccaTab = document.getElementById('tab-cca');
            if (subject === 'maths') {
                mathsTab.className = "flex-1 py-2 text-center rounded-md font-semibold bg-white text-blue-600 shadow transition-all";
                ccaTab.className = "flex-1 py-2 text-center rounded-md font-semibold text-gray-600 transition-all hover:text-blue-600";
                document.getElementById('subject-title').innerText = "Mathematics";
            } else {
                ccaTab.className = "flex-1 py-2 text-center rounded-md font-semibold bg-white text-blue-600 shadow transition-all";
                mathsTab.className = "flex-1 py-2 text-center rounded-md font-semibold text-gray-600 transition-all hover:text-blue-600";
                document.getElementById('subject-title').innerText = "Cultural & Creative Arts";
            }
            updateUI();
        }

        function randomizeCards() {
            // Shuffle the array
            for (let i = flashcardsData[currentSubject].length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcardsData[currentSubject][i], flashcardsData[currentSubject][j]] = [flashcardsData[currentSubject][j], flashcardsData[currentSubject][i]];
            }
            // Reset state
            currentIndex = 0;
            if (isFlipped) {
                // If currently flipped, flip back first then update
                flipCard(true);
                setTimeout(updateUI, 300);
            } else {
                updateUI();
            }
        }

        function flipCard(silent = false) {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').className = `flip-card-inner relative w-full h-full transform-style-3d shadow-xl rounded-2xl ${isFlipped ? 'flipped' : ''}`;
            if (!silent) MathJax.typesetPromise([document.getElementById('question-text'), document.getElementById('answer-text')]);
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % flashcardsData[currentSubject].length;
            resetAndLoadCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + flashcardsData[currentSubject].length) % flashcardsData[currentSubject].length;
            resetAndLoadCard();
        }

        function resetAndLoadCard() {
            if (isFlipped) {
                flipCard(true);
                setTimeout(updateUI, 300);
            } else {
                updateUI();
            }
        }

        function updateUI() {
            const card = flashcardsData[currentSubject][currentIndex];
            document.getElementById('question-text').innerHTML = card.q;
            document.getElementById('answer-text').innerHTML = card.a;
            document.getElementById('progress-text').innerText = `Card ${currentIndex + 1} / ${flashcardsData[currentSubject].length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / flashcardsData[currentSubject].length) * 100}%`;
            MathJax.typesetPromise([document.getElementById('question-text'), document.getElementById('answer-text')]);
        }

        window.onload = updateUI;
    </script>
</body>
</html>
